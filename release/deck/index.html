<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>AK15 Presentation Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@700&family=Noto+Sans+Arabic:wght@800&display=swap" rel="stylesheet">
<style>
/* Theme taken from the team's Canva deck "AFRIKA KOMMT - Presentation": forest green panels,
   cream/white paper, olive-gold accent, heavy tight grotesk headlines, knockout country names. */
:root {
  color-scheme: light;
  --green: #2d6a39; --green-2: #1f4d29; --green-3: #173b20; --green-soft: #e3ede0;
  --paper: #fdfbf6; --cream: #f6f1e5; --ink: #1c2a1f; --ink-2: #5a675d; --line: #ddd5c3;
  --gold: #a8924a; --gold-2: #d8bf6a; --gold-soft: #f1e8cc; --red: #c0392b;
  --head: "Inter Tight", "Segoe UI", system-ui, Arial, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b120d; overflow: hidden; }
body { font-family: var(--body); color: var(--ink); -webkit-font-smoothing: antialiased; }
#app { position: fixed; inset: 0; overflow: hidden; }
#stage { width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; transform-origin: center center; background: var(--paper); overflow: hidden; box-shadow: 0 0 80px rgba(0,0,0,.5); }

/* ---------- slides ---------- */
.slide { position: absolute; inset: 0; opacity: 0; visibility: hidden; transition: opacity .7s ease, visibility 0s linear .7s; background: var(--paper); overflow: hidden; }
.slide:not(.near) { display: none; }
.slide.active { opacity: 1; visibility: visible; transition: opacity .7s ease, visibility 0s; z-index: 2; }
.slide.dark { background: var(--green-3); color: #fff; }
.slide.green { background: var(--green); color: #fff; }
.slide.black { background: #000; color: #fff; }
.slide.cream { background: var(--cream); }

/* build steps: [data-s="n"] shows from step n; [data-x="n"] hides from step n */
[data-s] { opacity: 0; transform: translateY(34px); transition: opacity .75s cubic-bezier(.2,.8,.2,1), transform .75s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0s); }
[data-s].on { opacity: 1; transform: none; }
[data-s][data-fx="pop"] { transform: scale(.6); }
[data-s][data-fx="pop"].on { transform: none; transition-timing-function: cubic-bezier(.34,1.56,.64,1); }
[data-s][data-fx="left"] { transform: translateX(-60px); }
[data-s][data-fx="right"] { transform: translateX(60px); }
[data-s][data-fx="blur"] { transform: scale(1.06); } /* was a blur filter: too heavy on presenter laptops */
[data-s][data-fx="blur"].on { transform: none; }
.slide.near { will-change: opacity; }
.slide.near [data-s], .slide.near [data-x] { will-change: opacity, transform; }
[data-s][data-fx="fade"] { transform: none; }
[data-x] { transition: opacity .6s, transform .6s; }
[data-x].off { opacity: .0; pointer-events: none; }
[data-x].dim { opacity: .22; }
.slide.active .in { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; animation-delay: var(--d, .15s); }
@keyframes rise { from { opacity: 0; transform: translateY(40px); } }

/* ---------- type ---------- */
.h { font-family: var(--head); font-weight: 900; letter-spacing: -.045em; line-height: .92; margin: 0; }
.h.xl { font-size: 200px; } .h.l { font-size: 136px; } .h.m { font-size: 96px; } .h.s { font-size: 64px; } .h.xs { font-size: 44px; letter-spacing: -.03em; line-height: 1; }
.kick { font-family: var(--head); font-weight: 800; font-size: 24px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.lead { font-size: 34px; line-height: 1.38; color: var(--ink-2); font-weight: 500; }
.dark .lead, .green .lead, .black .lead { color: rgba(255,255,255,.82); }
.gold { color: var(--gold); } .g { color: var(--green); }
.abs { position: absolute; }
.brand { position: absolute; right: 64px; bottom: 44px; font-family: var(--head); font-weight: 900; font-size: 22px; letter-spacing: .02em; color: var(--green); opacity: .9; z-index: 5; }
.brand i { font-style: normal; color: var(--red); }
.dark .brand, .green .brand, .black .brand { color: rgba(255,255,255,.75); }
.secno { position: absolute; left: 64px; bottom: 44px; font-family: var(--head); font-weight: 800; font-size: 20px; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); z-index: 5; }
.dark .secno, .green .secno, .black .secno { color: rgba(255,255,255,.55); }
.rule { height: 3px; background: var(--green); border-radius: 2px; }

/* ---------- panels ---------- */
.panel-l { position: absolute; left: 0; top: 0; bottom: 0; background: var(--green); }
.panel-r { position: absolute; right: 0; top: 0; bottom: 0; background: var(--green); }
.card { background: #fff; border-radius: 26px; box-shadow: 0 14px 50px rgba(23,59,32,.12); }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 12px 26px; border-radius: 999px; font: 700 26px var(--head); background: var(--green-soft); color: var(--green-2); }
.dark .chip, .green .chip { background: rgba(255,255,255,.12); color: #fff; }

/* ---------- welcome ---------- */
.greet { position: absolute; font-family: var(--head); font-weight: 900; font-size: 84px; letter-spacing: -.03em; color: #fff; transition: opacity .9s, transform .9s, filter .9s; text-shadow: 0 6px 40px rgba(0,0,0,.35); white-space: nowrap; }
.greet small { display: block; font: 600 22px var(--body); letter-spacing: .08em; color: var(--gold-2); text-transform: uppercase; margin-top: 6px; text-shadow: none; }
.greet.gone { opacity: 0 !important; filter: blur(10px); transform: scale(.94); }
.greet.am { font-family: "Noto Sans Ethiopic", var(--head); }
.greet.ar { font-family: "Noto Sans Arabic", var(--head); }

/* ---------- baobab svg ---------- */
svg.bb { overflow: visible; }
svg.bb .trunk { fill: url(#barkG); }
svg.bb .limb { fill: none; stroke: #6f5a45; stroke-linecap: round; }
svg.bb .leaf { transition: opacity .6s, transform .6s; transform-box: fill-box; transform-origin: center; }
svg.bb .root { fill: none; stroke: #7a6248; stroke-linecap: round; opacity: .45; }
svg.bb .fruit { fill: #b7a35d; stroke: #8a7a40; stroke-width: 2; }
.ground-line { position: absolute; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, transparent, rgba(168,146,74,.6), transparent); }

/* ---------- map ---------- */
svg.map path.c { fill: #dfe6dc; stroke: #fff; stroke-width: 1.2; transition: fill .8s, opacity .8s; }
.dark svg.map path.c, .green svg.map path.c, .black svg.map path.c { fill: rgba(255,255,255,.12); stroke: rgba(255,255,255,.22); }
svg.map path.c.hl { fill: var(--green); }
.dark svg.map path.c.hl, .green svg.map path.c.hl, .black svg.map path.c.hl { fill: var(--gold-2); }
svg.map path.c.focus { fill: var(--gold) !important; }
svg.map .pin circle { fill: #fff; stroke: var(--green); stroke-width: 4; }
svg.map .pin text { font: 900 34px var(--head); fill: var(--green-2); text-anchor: middle; dominant-baseline: central; }
svg.map .lab { font: 700 22px var(--head); fill: var(--ink); }
.dark svg.map .lab, .green svg.map .lab { fill: #fff; }

/* ---------- game ---------- */
.round { position: absolute; left: 64px; top: 56px; display: flex; gap: 14px; align-items: center; z-index: 4; }
.round b { font: 900 26px var(--head); letter-spacing: .14em; text-transform: uppercase; }
.round .pips { display: flex; gap: 7px; }
.round .pips i { width: 16px; height: 16px; border-radius: 50%; background: rgba(0,0,0,.12); }
.round .pips i.done { background: var(--gold); } .round .pips i.now { background: var(--green); box-shadow: 0 0 0 4px rgba(45,106,57,.25); }
.dark .round .pips i { background: rgba(255,255,255,.18); } .dark .round .pips i.now { background: #fff; }
.clue { display: flex; gap: 34px; align-items: flex-start; }
.clue .n { flex: none; width: 92px; height: 92px; border-radius: 26px; background: var(--green); color: #fff; font: 900 50px/92px var(--head); text-align: center; }
.clue p { margin: 6px 0 0; font: 700 48px/1.18 var(--head); letter-spacing: -.02em; color: var(--ink); }
.dark .clue p { color: #fff; } .dark .clue .n { background: var(--gold); }
.timer { position: absolute; width: 190px; height: 190px; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 14; }
.timer .bg { stroke: rgba(0,0,0,.08); } .dark .timer .bg { stroke: rgba(255,255,255,.14); }
.timer .fg { stroke: var(--gold); stroke-linecap: round; stroke-dasharray: 534; stroke-dashoffset: 0; }
.timer.on .fg { animation: tick 10s linear forwards; }
@keyframes tick { to { stroke-dashoffset: 534; } }
.timer span { position: absolute; inset: 0; display: grid; place-items: center; font: 900 30px var(--head); letter-spacing: .1em; }
.knock { font-family: var(--head); font-weight: 900; letter-spacing: -.05em; line-height: .86; display: inline-block; color: inherit; }
.slide.cream .knock, .slide:not(.dark):not(.green):not(.black) .knock { color: var(--green-2); }
.flagstrip { height: 26px; width: 520px; border-radius: 6px; margin-top: 22px; background-size: cover; background-position: center; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
.reveal-wrap { position: absolute; inset: 0; }
.bignum { font: 900 300px/0.85 var(--head); letter-spacing: -.06em; color: var(--green); }
.dark .bignum { color: #fff; }
.tf { display: inline-block; padding: 10px 26px; border-radius: 14px; font: 900 40px var(--head); letter-spacing: .1em; border: 5px solid currentColor; transform: rotate(-6deg); color: var(--green); }
.beat { width: 120px; height: 120px; border-radius: 50%; background: var(--gold); animation: beat .27s ease-out infinite; }
@keyframes beat { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(216,191,106,.7); } 30% { transform: scale(1.18); } 100% { transform: scale(1); box-shadow: 0 0 0 60px rgba(216,191,106,0); } }

/* ---------- fellows ---------- */
.fgrid { position: absolute; display: grid; gap: 30px; }
.fcard { background: #fff; border-radius: 30px; box-shadow: 0 16px 50px rgba(23,59,32,.14); padding: 34px 34px 52px; position: relative; overflow: hidden; display: flex; flex-direction: column; }
.fcard .ph { width: 190px; height: 190px; border-radius: 50%; margin: 0 auto 22px; position: relative; flex: none; }
.fcard .ph img, .fcard .ph .ini { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; border: 6px solid #fff; box-shadow: 0 0 0 4px var(--green); background: var(--green-soft); }
.fcard .ph .ini { display: grid; place-items: center; font: 900 70px var(--head); color: var(--green); letter-spacing: -.04em; }
.fcard.on .ph::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 4px solid var(--gold); animation: ring 1.6s ease-out .3s 2; opacity: 0; }
@keyframes ring { 0% { opacity: .9; transform: scale(1); } 100% { opacity: 0; transform: scale(1.35); } }
.fcard h3 { margin: 0; text-align: center; font: 900 46px/1 var(--head); letter-spacing: -.035em; color: var(--green-2); }
.fcard .role { text-align: center; font: 600 20px/1.35 var(--body); color: var(--ink-2); margin: 10px 0 18px; min-height: 54px; }
.fcard .fact { display: flex; gap: 14px; align-items: flex-start; font: 500 22px/1.38 var(--body); color: var(--ink); margin-top: 12px; }
.fcard .fact i { flex: none; font-style: normal; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font: 800 18px var(--head); margin-top: 1px; }
.fcard .fact.fun i { background: var(--gold-soft); color: var(--gold); }
.fcard .fact.ser i { background: var(--green-soft); color: var(--green); }
.fcard .stand { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; font: 800 15px var(--head); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); opacity: 0; transition: opacity .5s .9s; }
.fcard.on .stand { opacity: 1; }
.fcard.compact { padding: 26px 26px 56px; min-height: 580px; }
.fcard.compact .ph { width: 140px; height: 140px; margin-bottom: 16px; }
.fcard.compact h3 { font-size: 36px; }
.fcard.compact .role { font-size: 17px; min-height: 46px; margin: 8px 0 10px; }
.fcard.compact .fact { font-size: 18px; margin-top: 8px; }
.fcard.compact .fact i { width: 30px; height: 30px; font-size: 15px; }

/* ---------- misc ---------- */
.stat { font: 900 150px/0.9 var(--head); letter-spacing: -.055em; color: var(--green); }
.stat-l { font: 600 26px/1.3 var(--body); color: var(--ink-2); margin-top: 14px; }
.dark .stat, .green .stat { color: #fff; } .dark .stat-l, .green .stat-l { color: rgba(255,255,255,.75); }
.pillar { border-top: 4px solid var(--green); padding-top: 22px; }
.pillar h4 { margin: 0 0 10px; font: 800 36px var(--head); letter-spacing: -.02em; color: var(--green-2); }
.pillar p { margin: 0; font: 500 24px/1.4 var(--body); color: var(--ink-2); }
.tl-node { position: absolute; width: 330px; margin-left: -165px; margin-top: -20px; text-align: center; }
.tl-node .dot { width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 7px solid var(--gold); margin: 0 auto 18px; }
.tl-node b { display: block; font: 900 44px var(--head); letter-spacing: -.03em; }
.tl-node span { font: 600 22px var(--body); opacity: .75; }
.step6 { position: absolute; width: 270px; text-align: center; transform: translateX(-50%); }
.step6 .badge { width: 110px; height: 110px; border-radius: 50%; margin: 0 auto 18px; display: grid; place-items: center; font: 900 52px var(--head); background: var(--green-soft); color: var(--green); border: 5px solid #fff; box-shadow: 0 8px 26px rgba(23,59,32,.18); transition: background .6s, color .6s, transform .6s; }
.step6.on .badge { background: var(--green); color: #fff; transform: scale(1.08); }
.step6 > :not(.badge) { position: relative; background: var(--paper); border-radius: 8px; }
.step6 h5 { margin: 0 0 8px; font: 800 24px/1.18 var(--head); color: var(--green-2); }
.step6 .co { font: 800 20px var(--head); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 8px; }
.step6 .num { font: 600 19px/1.35 var(--body); color: var(--ink-2); }
.step6 > :not(.badge) { transition: opacity .5s; }
.step6:not(.on) > :not(.badge) { opacity: 0; }
.unv { display: none; }
body.notes-on .unv { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 6px; background: #f3c969; color: #4a3600; font: 700 13px var(--body); }
iframe.offer { position: absolute; inset: 0; width: 1920px; height: 1080px; border: 0; opacity: 0; transition: opacity .6s; }
iframe.offer.on { opacity: 1; }
canvas.fx { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; }

/* ---------- HUD / notes / grid ---------- */
#hud { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 10px; align-items: center; z-index: 20; font: 600 13px var(--body); color: #fff; background: rgba(10,20,12,.72); padding: 8px 14px; border-radius: 999px; opacity: 0; transition: opacity .4s; backdrop-filter: blur(6px); }
body.hud-show #hud, #hud:hover { opacity: 1; }
#hud button { font: 700 13px var(--body); color: #fff; background: rgba(255,255,255,.12); border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; }
#hud button:hover { background: rgba(255,255,255,.25); }
#hud .pos { min-width: 150px; text-align: center; opacity: .9; }
#progress { position: fixed; left: 0; bottom: 0; height: 4px; background: var(--gold-2); z-index: 21; transition: width .5s; }
#notes { position: fixed; left: 0; right: 0; bottom: 0; max-height: 38vh; overflow: auto; z-index: 19; background: rgba(12,22,14,.94); color: #eef3ec; font: 400 17px/1.55 var(--body); padding: 18px 28px 60px; display: none; border-top: 3px solid var(--gold-2); }
body.notes-on #notes { display: block; }
body:not(.presenter) #notes, body:not(.presenter) [data-a="notes"], body:not(.presenter) .unv { display: none !important; }
#notes h6 { margin: 0 0 6px; font: 800 13px var(--head); letter-spacing: .16em; text-transform: uppercase; color: var(--gold-2); }
#notes p { margin: 0 0 8px; max-width: 1100px; }
#notes b { color: #fff; }
#grid { position: fixed; inset: 0; z-index: 30; background: rgba(8,16,10,.96); color: #fff; overflow: auto; display: none; padding: 34px 40px 80px; font-family: var(--body); }
body.grid-on #grid { display: block; }
#grid h2 { font: 900 34px var(--head); margin: 0 0 4px; letter-spacing: -.02em; }
#grid .help { opacity: .7; margin: 0 0 24px; font-size: 14px; }
#grid section { margin: 0 0 22px; }
#grid h3 { font: 800 14px var(--head); letter-spacing: .16em; text-transform: uppercase; color: var(--gold-2); margin: 0 0 10px; }
#grid .items { display: flex; flex-wrap: wrap; gap: 8px; }
#grid button { font: 600 14px var(--body); color: #fff; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 9px 12px; cursor: pointer; text-align: left; }
#grid button.cur { background: var(--green); border-color: var(--gold-2); }
#grid button:hover { background: rgba(255,255,255,.18); }
#start { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: #000; color: #fff; cursor: pointer; text-align: center; font-family: var(--body); }
#start b { display: block; font: 900 46px var(--head); letter-spacing: -.02em; margin-bottom: 14px; }
#start span { opacity: .65; font-size: 17px; line-height: 1.7; }
#start kbd { font: 700 13px var(--body); border: 1px solid rgba(255,255,255,.4); border-radius: 6px; padding: 2px 7px; }
html.still *, html.still *::after { transition: none !important; animation-duration: 0s !important; animation-delay: 0s !important; }
@media (prefers-reduced-motion: reduce) { [data-s], .slide { transition-duration: .01s !important; } .beat { animation: none; } }
</style>
</head>
<body>
<div id="app"><div id="stage"></div></div>
<div id="progress"></div>
<div id="hud">
  <button data-a="prev" title="Back (←)">←</button>
  <span class="pos" id="pos"></span>
  <button data-a="next" title="Next (→ / space)">→</button>
  <button data-a="grid" title="All slides (G)">Slides</button>
  <button data-a="notes" title="Speaker notes (N)">Notes</button>
  <button data-a="mute" title="Sound (M)" id="muteBtn">Sound off</button>
  <button data-a="fs" title="Full screen (F)">Full screen</button>
  <a href="../hub/" style="color:#fff;opacity:.7;text-decoration:none;padding:0 6px">All pages</a>
</div>
<div id="notes"></div>
<div id="grid"></div>
<div id="start"><div><b>AFRIKA KOMMT! 15</b><span>Click or press <kbd>Space</kbd> to begin. Sound is off; press <kbd>M</kbd> to turn it on.<br><kbd>→</kbd> next · <kbd>←</kbd> back · <kbd>F</kbd> full screen · <kbd>G</kbd> all slides · <kbd>B</kbd> blank screen · <kbd>M</kbd> sound</span></div></div>

<script src="../data.js?v=mwyzwb0c"></script>
<script src="../africa.js?v=mwyzwb0c"></script>
<script src="facts.js?v=mwyzwb0c"></script>
<script>
(() => {
"use strict";
const D = window.BRAIN_DATA || { fellows: [] };
const GEO = window.AFRICA_GEO || { features: [] };
const FLAGS = window.AFRICA_FLAGS || {};
const FACTS = window.DECK_FACTS || {};
const PHOTOS = window.DECK_PHOTOS || {};
const stage = document.getElementById("stage");
const STILL = /[?&]still/.test(location.search); // screenshot mode: no tweens
if (STILL) document.documentElement.classList.add("still");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ================= data ================= */
const NICK = { F01: "Muna", F07: "Noble", F10: "Udoka", F11: "Mwai", F24: "Hannah", F25: "Debby", F28: "Busayomi", F16: "Annie", F18: "Meaza", F19: "Edwin", F31: "Nana Akua" };
const fellows = D.fellows.map((f) => {
  const x = FACTS[f.id] || {};
  const short = x.short || NICK[f.id] || f.name.split(/\s+/)[0];
  return { ...f, short, fun: x.fun !== undefined ? x.fun : f.beyond_cv, serious: x.serious || null, photo: PHOTOS[f.id] || null };
});
const OFFICIAL = { F01: "Mayimuna Kizza Lugonvu", F07: "Chikaodiri Enyinnaya", F11: "Mwaiwathu Ziva Chapweteka", F14: "Oluwatooni Adedeji", F17: "Vivian Alice Okeyo", F24: "Hannah Kibret", F28: "Busayomi Thompson-Ajayi", F31: "Nana Akua Kwakyi" };
fellows.forEach((f) => { f.full = OFFICIAL[f.id] || f.name; });
const byCountry = {};
for (const f of fellows) (byCountry[f.country] = byCountry[f.country] || []).push(f);
const COUNT = (c) => (byCountry[c] || []).length;

/* Game order and facts: from the Google Doc "COUNTRY AND FELLOW FACTS" (Kelvin + Agnes). Formats vary so 11 rounds don't repeat. */
const ROUNDS = [
  { c: "Cameroon", fmt: "nickname", region: "Central Africa", nick: "“Africa in Miniature”",
    clues: ["Locals call it “Le Continent”.", "Rainforest, savannah, mountains, coast, and hundreds of languages, all in one country."] },
  { c: "Egypt", fmt: "number", region: "North Africa", num: 7000, unit: "years", line: "of recorded history, one of the oldest continuous civilisations on Earth." },
  { c: "Malawi", fmt: "number", region: "Southern Africa", num: 365, unit: "miles", line: "Its great lake runs 365 miles north to south, so people call it the “Calendar Lake”." },

ROUNDS.forEach((R, ri) => {
  const n = COUNT(R.c), pips = ROUNDS.map((_, i) => `<i class="${i < ri ? "done" : i === ri ? "now" : ""}"></i>`).join("");
  const dark = ri % 2 === 1;
  const round = `<div class="round"><b class="${dark ? "" : "g"}">Round ${ri + 1}</b><div class="pips">${pips}</div></div>`;
  let body = "", clueSteps = 0;
  if (R.fmt === "number") {
    clueSteps = 1;
    body = `<div class="abs" style="left:110px;top:230px;width:1100px">
      <div class="kick">${esc(R.region)} · How well do you know it?</div>
      <div class="bignum" style="margin-top:30px"><span data-count="${R.num}" data-pre="${esc(R.pre || "")}" data-suf="${R.unit === "%" ? "%" : ""}" data-dur="2000">0</span></div>
      ${R.unit !== "%" ? `<div class="h s" style="color:var(--gold)">${esc(R.unit)}</div>` : ""}
      <p class="lead" data-s="1" style="margin-top:34px;max-width:1000px;font-size:40px;color:inherit;font-weight:600">${esc(R.line)}</p></div>`;
  } else if (R.fmt === "nickname") {
    clueSteps = R.clues.length + 1;
    body = `<div class="abs" style="left:110px;top:220px;width:1150px">
      <div class="kick">${esc(R.region)} · Its nickname is…</div>
      <div class="h l g" data-s="1" data-fx="blur" style="margin-top:30px">${esc(R.nick)}</div>
      ${R.clues.map((c, i) => `<div class="clue" data-s="${i + 2}" style="margin-top:${i ? 30 : 60}px"><div class="n">${i + 1}</div><p>${esc(c)}</p></div>`).join("")}</div>`;
  } else if (R.fmt === "tf") {
    clueSteps = R.clues.length * 2;
    body = `<div class="abs" style="left:110px;top:200px;width:1200px"><div class="kick">${esc(R.region)} · True or false?</div>
      ${R.clues.map((c, i) => `<div style="margin-top:60px;display:flex;gap:40px;align-items:center"><div class="clue" data-s="${i * 2 + 1}" style="flex:1"><div class="n">?</div><p>${esc(c[0])}</p></div><div data-s="${i * 2 + 2}" data-fx="pop"><span class="tf">${c[1] ? "TRUE" : "FALSE"}</span></div></div>`).join("")}</div>`;
  } else if (R.fmt === "beat") {
    clueSteps = R.clues.length;
    body = `<div class="abs" style="left:110px;top:200px;width:1150px"><div class="kick">${esc(R.region)} · Feel the clue</div>
      ${R.clues.map((c, i) => `<div class="clue" data-s="${i + 1}" style="margin-top:${i ? 40 : 60}px"><div class="n">${i + 1}</div><p>${esc(c)}</p></div>`).join("")}</div>
      <div class="abs" data-s="2" style="left:1520px;top:400px"><div class="beat"></div></div>`;
  } else {
    clueSteps = R.clues.length;
    const rapid = R.fmt === "rapid";
    body = `<div class="abs" style="left:110px;top:${rapid ? 180 : 210}px;width:1180px"><div class="kick">${esc(R.region)} · ${rapid ? "Rapid fire" : `${R.clues.length} clues`}</div>
      ${R.clues.map((c, i) => `<div class="clue" data-s="${i + 1}" ${rapid ? 'data-fx="left"' : ""} style="margin-top:${i ? (rapid ? 28 : 40) : 56}px"><div class="n">${i + 1}</div><p ${rapid ? 'style="font-size:42px"' : ""}>${esc(c)}</p></div>`).join("")}</div>`;
  }
  const guess = clueSteps + 1, reveal = clueSteps + 2;
  add({ sec: 2, title: `Round ${ri + 1}: ${R.c}`, cls: dark ? "dark" : "", steps: reveal, round: R.c,
    html: () => `${round}
      <div class="reveal-wrap" data-x="${reveal}">${body}
        <div class="timer" data-s="${guess}" data-fx="pop" style="left:1560px;top:120px"><svg viewBox="0 0 190 190"><circle class="bg" cx="95" cy="95" r="85"/><circle class="fg" cx="95" cy="95" r="85"/></svg><span>GUESS</span></div>
        <div class="abs" data-s="${guess}" style="left:1400px;top:360px;width:420px;height:460px;opacity:.9">${mapSVG({ w: 420, h: 460, hl: [], cls: "mini" })}</div>
      </div>
      <div class="reveal-wrap">
        <div class="abs" data-s="${reveal}" data-fx="blur" style="left:90px;top:170px;width:1060px">
          <div class="kick">${esc(R.region)}</div>
          <div class="knock" style="font-size:${Math.min(280, Math.floor(1000 / (R.c.length * 0.68)))}px;margin-top:16px">${esc(R.c.toUpperCase())}</div>
          <div class="flagstrip" style="background-image:url('${FLAGS[R.c] || ""}')"></div>
          <div style="display:flex;gap:18px;margin-top:40px;align-items:center"><span class="chip" style="font-size:34px;padding:16px 34px">${n} fellow${n > 1 ? "s" : ""}</span><span class="lead" style="font-size:30px">${n > 4 ? "Please stand up!" : "Get ready to stand…"}</span></div>
        </div>
        <div class="abs" data-s="${reveal}" data-fx="fade" style="left:1150px;top:80px;width:700px;height:900px">${mapSVG({ w: 700, h: 900, focus: R.c, hl: [] })}</div>
      </div>${brand()}`,
    onStep(el, s) {
      el.querySelector(".timer").classList.toggle("on", s === guess);
      el.querySelectorAll("[data-x]").forEach((x) => x.classList.toggle("off", s >= +x.dataset.x));
      if (s === reveal) { ding(); }
      countUp(el);
    },
    notes: `<b>${esc(R.c)} round.</b> Click through the clues (${clueSteps}). Next click starts a 10-second “guess” ring and shows a blank map; let the room shout answers. Next click reveals <b>${esc(R.c.toUpperCase())}</b>, its place on the map and its ${n} fellow${n > 1 ? "s" : ""}.${R.c === "Kenya" ? " <i>Note: the doc said “first known man, from Olduvai”; Olduvai is in Tanzania, so this uses Turkana Boy (found in Kenya).</i>" : ""}${R.c === "Nigeria" ? " <i>Twin-birth figure in the doc (158 per 1,000) refers to Igbo-Ora, so the slide says “one of the highest”.</i>" : ""}` });

  // fellows of this country: up to 4 per slide (doc); small groups reveal one by one, big groups all together
  const fs = byCountry[R.c] || [], chunks = [];
  for (let i = 0; i < fs.length; i += 4) chunks.push(fs.slice(i, i + 4));
  chunks.forEach((ch, ci) => {
    const one = fs.length <= 2, cols = ch.length, compact = cols >= 3;
    const W = compact ? 400 : 560, gap = 30, total = cols * W + (cols - 1) * gap, left = (1920 - total) / 2;
    add({ sec: 2, title: `${R.c}: meet ${ch.map((f) => f.short).join(", ")}`, cls: "cream", steps: one ? ch.length : 1,
      html: () => `<div class="abs" style="left:64px;top:50px;display:flex;align-items:center;gap:22px">
          <img src="${FLAGS[R.c] || ""}" alt="" style="width:72px;height:54px;border-radius:8px;object-fit:cover;box-shadow:0 2px 10px rgba(0,0,0,.15)">
          <div class="h s g in" style="font-size:58px">${one ? "And coming from" : "Please stand,"} ${esc(R.c)}${chunks.length > 1 ? ` <span style="color:var(--gold);font-size:40px">${ci + 1}/${chunks.length}</span>` : ""}</div></div>
        <div class="abs" style="right:70px;top:30px;width:150px;height:170px">${mapSVG({ w: 150, h: 170, focus: R.c })}</div>
        <div class="fgrid" style="left:${left}px;top:${compact ? 210 : 230}px;grid-template-columns:repeat(${cols},${W}px);gap:${gap}px">
          ${ch.map((f, i) => `<div class="fcard ${compact ? "compact" : ""}" data-s="${one ? i + 1 : 1}" data-fx="pop" style="--d:${one ? 0 : i * 0.18}s">
            <span class="stand">Please stand</span>
            <div class="ph">${photo(f)}</div><h3 style="${f.full.length > 18 ? "font-size:34px" : f.full.length > 14 ? "font-size:40px" : ""}">${esc(f.full)}</h3>
            <div class="role">${esc(f.role.replace(/s*(formerly[^)]*)/, "").replace(/;.*$/, ""))}${f.org && !/^\(/.test(f.org) ? ` · ${esc(f.org)}` : ""}</div>
            ${f.serious ? `<div class="fact ser"><i>▲</i><span>${esc(f.serious)}</span></div>` : ""}
            ${f.fun ? `<div class="fact fun"><i>✦</i><span>${esc(f.fun)}</span></div>` : ""}
          </div>`).join("")}
        </div>${brand()}`,
      onStep(el, s) { el.querySelectorAll(".fcard").forEach((c) => c.classList.toggle("on", c.classList.contains("on"))); if (s > 0) ding(1.5); },
      notes: one
        ? ch.map((f, i) => `<p><b>Click ${i + 1}:</b> “${i ? "Next is" : `And coming from ${esc(R.c)} is`} ${esc(f.short)}. ${esc(f.short)}, please stand.” ${f.serious ? `They are great because ${esc(f.serious.replace(/\.$/, ""))}.` : ""} ${f.fun ? `Fun fact: ${esc(f.fun)}` : ""}</p>`).join("") + `<p>“Please give a hand for ${esc(R.c)}.”</p>`
        : `<p><b>${esc(R.c)} stands as a group</b> (no individual introductions: time). One click shows ${ch.map((f) => esc(f.short)).join(", ")}. The screen carries their facts for anyone who wants to read. ${ci === chunks.length - 1 ? `“Please give a hand for ${esc(R.c)}!”` : "Next click: the rest of the group."}</p>` });
  });
});

/* ================= render ================= */
S.forEach((sl, i) => {
  const el = document.createElement("section");
  el.className = "slide " + (sl.cls || "");
  el.dataset.i = i;
  el.innerHTML = sl.html().replace(/<canvas class="fx"[^>]*><\/canvas>/g, ""); // ambient canvases removed (lag, 26 Nov feedback)
  stage.appendChild(el);
  sl.el = el;
});

/* ================= ambient canvases ================= */
function fxLoop() {
  const cur = S[idx]; if (!cur) return requestAnimationFrame(fxLoop);
  cur.el.querySelectorAll("canvas.fx").forEach((c) => {
    if (!c._p) { c.width = 1920; c.height = 1080; seed(9); c._p = Array.from({ length: 140 }, () => ({ x: rnd() * 1920, y: rnd() * 1080, v: .2 + rnd() * .6, r: .8 + rnd() * 2.4, a: rnd() * 6.28, s: rnd() })); }
    const g = c.getContext("2d"), kind = c.dataset.fx, t = performance.now() / 1000; g.clearRect(0, 0, 1920, 1080);
    if (kind === "sun") { const gr = g.createRadialGradient(1600, 120, 10, 1600, 120, 700); gr.addColorStop(0, "rgba(255,214,120,.45)"); gr.addColorStop(1, "rgba(255,214,120,0)"); g.fillStyle = gr; g.fillRect(0, 0, 1920, 1080); }
    if (kind === "spot") { for (let k = 0; k < 3; k++) { const x = 960 + Math.sin(t * .6 + k * 2.1) * 620, gr = g.createRadialGradient(x, 1080, 10, x, 400, 900); gr.addColorStop(0, "rgba(255,255,255,.16)"); gr.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = gr; g.beginPath(); g.moveTo(x - 60, 1080); g.lineTo(x - 420, 0); g.lineTo(x + 420, 0); g.lineTo(x + 60, 1080); g.fill(); } }
    const stop = c.dataset.state === "stop";
    for (const p of c._p) {
      if (kind === "exchange") {
        const dir = p.s > .5 ? 1 : -1, y = 470 + Math.sin(p.a + t) * 160 * p.s;
        p.x += dir * (2 + p.v * 3); if (p.x > 1620) p.x = 300; if (p.x < 300) p.x = 1620;
        g.fillStyle = dir > 0 ? "rgba(216,191,106,.85)" : "rgba(134,178,94,.85)"; g.beginPath(); g.arc(p.x, y, p.r + 1, 0, 6.28); g.fill(); continue;
      }
      if (kind === "converge") {
        const k = c.dataset.state === "go" ? 1 : 0, tx = 960 + Math.cos(p.a) * 520 * (1 - k * .55), ty = 560 + Math.sin(p.a) * 300 * (1 - k * .55);
        p.x += (tx - p.x) * .03; p.y += (ty - p.y) * .03; p.a += .002;
        g.fillStyle = "rgba(216,191,106,.6)"; g.beginPath(); g.arc(p.x, p.y, p.r + .6, 0, 6.28); g.fill(); continue;
      }
      if (kind === "freeze") {
        if (!stop) { p.x += Math.cos(p.a) * p.v * 1.6; p.y += Math.sin(p.a) * p.v * 1.6; p.a += (rnd() - .5) * .08; }
        if (p.x < 0) p.x = 1920; if (p.x > 1920) p.x = 0; if (p.y < 0) p.y = 1080; if (p.y > 1080) p.y = 0;
        g.fillStyle = stop ? "rgba(45,106,57,.18)" : "rgba(45,106,57,.35)"; g.beginPath(); g.arc(p.x, p.y, p.r * 2, 0, 6.28); g.fill(); continue;
      }
      p.y -= p.v * .5; p.x += Math.sin(t + p.a) * .25; if (p.y < -10) { p.y = 1090; p.x = rnd() * 1920; }
      g.fillStyle = `rgba(216,191,106,${(.15 + .35 * Math.abs(Math.sin(t * .8 + p.a))).toFixed(2)})`; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.28); g.fill();
    }
  });
  requestAnimationFrame(fxLoop);
}

/* ================= navigation ================= */
let idx = 0, step = 0, started = false;
function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(-50%, -50%) scale(${k})`; }
addEventListener("resize", fit); fit();
function applyStep(sl, s, fromEnter) {
  sl.el.querySelectorAll("[data-s]").forEach((e) => e.classList.toggle("on", s >= +e.dataset.s));
  sl.el.querySelectorAll("[data-x]").forEach((e) => e.classList.toggle("off", s >= +e.dataset.x));
  countUp(sl.el);
  if (sl.onStep) sl.onStep(sl.el, s, fromEnter);
}
function go(i, s = 0, dir = 1) {
  i = Math.max(0, Math.min(S.length - 1, i));
  const prev = S[idx];
  if (i !== idx || !prev.el.classList.contains("active")) {
    prev.el.classList.remove("active");
    if (started && i !== idx) whoosh();
    const sl = S[i];
    resetCounts(sl.el);
    sl.el.querySelectorAll(".in").forEach((e) => { e.style.animation = "none"; void e.offsetWidth; e.style.animation = ""; });
    sl.el.classList.add("active");
    if (sl.onEnter) sl.onEnter(sl.el);
  }
  S.forEach((x, j) => { const near = Math.abs(j - i) <= 1; x.el.classList.toggle("near", near); if (near) x.el.querySelectorAll("iframe[data-src]:not([src])").forEach((f) => (f.src = f.dataset.src)); });
  idx = i; step = Math.max(0, Math.min(S[i].steps || 0, s));
  applyStep(S[i], step, true);
  ui();
}
function next() { if (!started) return begin(); const sl = S[idx]; if (step < (sl.steps || 0)) { step++; applyStep(sl, step); if (idx === 0 && step === 1) deepNote(); ui(); } else if (idx < S.length - 1) go(idx + 1, 0); }
function prev() { const sl = S[idx]; if (step > 0) { step--; applyStep(sl, step); ui(); } else if (idx > 0) go(idx - 1, S[idx - 1].steps || 0, -1); }
function ui() {
  const sl = S[idx];
  document.getElementById("pos").textContent = `${idx + 1} / ${S.length}${sl.steps ? ` · ${step}/${sl.steps}` : ""}`;
  document.getElementById("progress").style.width = ((idx + (sl.steps ? step / sl.steps : 1)) / S.length * 100).toFixed(2) + "%";
  document.getElementById("notes").innerHTML = `<h6>${esc(SECS[sl.sec])} · ${idx + 1}. ${esc(sl.title)}</h6><p>${sl.notes || ""}</p>`;
  history.replaceState(null, "", `#${idx + 1}${step ? "." + step : ""}`);
  document.querySelectorAll("#grid button[data-i]").forEach((b) => b.classList.toggle("cur", +b.dataset.i === idx));
}
function begin() { started = true; document.getElementById("start").remove(); try { ac().resume(); } catch (e) {} }
// grid of all slides
(() => {
  let h = `<h2>All slides</h2><p class="help">Click a slide to jump to it. G or Esc closes this.</p>`;
  SECS.forEach((name, si) => {
    const items = S.map((s, i) => [s, i]).filter(([s]) => s.sec === si);
    if (!items.length) return;
    h += `<section><h3>${String(si).padStart(2, "0")} · ${esc(name)}</h3><div class="items">${items.map(([s, i]) => `<button data-i="${i}">${i + 1}. ${esc(s.title)}</button>`).join("")}</div></section>`;
  });
  const g = document.getElementById("grid"); g.innerHTML = h;
  g.addEventListener("click", (e) => { const b = e.target.closest("button[data-i]"); if (!b) return; if (!started) begin(); document.body.classList.remove("grid-on"); go(+b.dataset.i, 0); });
})();
function toggle(c) { document.body.classList.toggle(c); }
function fs() { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); }
function mute() { muted = !muted; if (!muted) { try { ac().resume(); } catch (e) {} } document.getElementById("muteBtn").textContent = muted ? "Sound off" : "Sound on"; }
if (!muted) document.getElementById("muteBtn").textContent = "Sound on";
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === "ArrowRight" || k === " " || k === "PageDown" || k === "Enter") { e.preventDefault(); next(); }
  else if (k === "ArrowLeft" || k === "PageUp" || k === "Backspace") { e.preventDefault(); prev(); }
  else if (k === "Home") go(0); else if (k === "End") go(S.length - 1);
  else if (k === "f" || k === "F") fs();
  else if (k === "n" || k === "N") toggle("notes-on");
  else if (k === "g" || k === "G") toggle("grid-on");
  else if (k === "m" || k === "M") mute();
  else if (k === "Escape") document.body.classList.remove("grid-on");
  else if (k === "b" || k === "B" || k === ".") stage.style.opacity = stage.style.opacity === "0" ? "" : "0";
});
document.getElementById("start").addEventListener("click", begin);
let lastClick = 0;
stage.addEventListener("click", (e) => { if (e.target.closest("a,button,iframe")) return; const t = performance.now(); if (t - lastClick < 350) return; lastClick = t; next(); });
document.getElementById("hud").addEventListener("click", (e) => { const a = e.target.closest("button")?.dataset.a; if (a === "prev") prev(); if (a === "next") next(); if (a === "grid") toggle("grid-on"); if (a === "notes") toggle("notes-on"); if (a === "mute") mute(); if (a === "fs") fs(); });
let hudT; addEventListener("mousemove", () => { document.body.classList.add("hud-show"); clearTimeout(hudT); hudT = setTimeout(() => document.body.classList.remove("hud-show"), 1800); });
let tx0 = null; addEventListener("touchstart", (e) => { tx0 = e.touches[0].clientX; }, { passive: true });
addEventListener("touchend", (e) => { if (tx0 == null) return; const dx = e.changedTouches[0].clientX - tx0; if (Math.abs(dx) > 50) (dx < 0 ? next : prev)(); tx0 = null; });

const m = location.hash.match(/^#(\d+)(?:\.(\d+))?/);
const qs = new URLSearchParams(location.search);
if (qs.has("notes")) document.body.classList.add("presenter"); // presenter view: /deck/?notes
if (m || qs.has("nostart")) { begin(); go(m ? +m[1] - 1 : 0, m && m[2] ? +m[2] : 0); } else go(0, 0);
})();
</script>
